# Dedicated public record backup. No wallet access or private RPC credentials.
name: Preserve Breath record
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: breath-record
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify and copy primary record
        run: node scripts/preserve-record.mjs backup
      - name: Preserve history and keep scheduled backup active
        shell: bash
        run: |
          date -u +%Y-%m > backup/maintenance-month.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve verified Breath record"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backup
      - name: Publish verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4

